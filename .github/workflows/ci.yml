name: WineMetric CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and Validate WineMetric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install WineMetric package
        run: python -m pip install .

      - name: Verify package import
        run: |
          python -c "import mlProject; print('WineMetric package import successful')"

      - name: Verify prediction module
        run: |
          python -c "from mlProject.pipeline.prediction import PredictionPipeline; print('Prediction pipeline import successful')"

      - name: Run training pipeline
        run: python main.py

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: winemetric:ci